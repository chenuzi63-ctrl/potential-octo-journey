# 云编译：把本工程推到 GitHub 后，云端自动构建出可安装的 debug APK。
# 无需本机安装 JDK / Android SDK / Gradle（适合 Windows 7 等旧系统）。
name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK (API 37)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools'

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          # AGP 8.7.3 要求最低 Gradle 8.9（8.7 会直接报版本不兼容）
          gradle-version: '8.9'

      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
