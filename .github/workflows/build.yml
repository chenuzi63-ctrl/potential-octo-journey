# 云编译：把本工程推到 GitHub 后，云端自动构建出可安装的 debug APK。
# 无需本机安装 JDK / Android SDK / Gradle（适合 Windows 7 等旧系统）。
name: Build Debug APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;35.0.0 platform-tools'

      - name: 安装 Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          # AGP 8.7.3 要求最低 Gradle 8.9（8.7 会直接报版本不兼容）
          gradle-version: '8.9'

      # 失败时把关键报错输出为 annotation，便于远程定位（日志本身需登录才能看）
      - name: 编译 Debug APK
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            summary=$(grep -E "e: |error:|What went wrong|FAILURE:|Unresolved reference|Caused by:|> Task .* FAILED" build.log | head -n 30)
            escaped=$(printf '%s' "$summary" | sed 's/%/%25/g' | awk 'BEGIN{ORS=""} {print $0"%0A"}')
            echo "::error title=Gradle error summary::$escaped"
          fi
          exit "$code"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: autoclicker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
